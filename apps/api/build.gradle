plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.douid'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
    querydslVersion = '7.4.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	// QueryDSL JPA
   implementation platform("io.github.openfeign.querydsl:querydsl-bom:${querydslVersion}")
   implementation 'io.github.openfeign.querydsl:querydsl-jpa'

   // QClass 생성용 Annotation Processor
   annotationProcessor platform("io.github.openfeign.querydsl:querydsl-bom:${querydslVersion}")
   annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"

   // Annotation Processor가 jakarta 타입을 인식하도록 명시
   annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
   annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:postgresql:1.21.4'
	testImplementation 'org.testcontainers:testcontainers:1.21.4'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// testcontainers 1.21.4가 자체 pom에서 docker-java 3.4.2를 명시 고정하는데,
// 이 버전이 최신 Docker Desktop 소켓 프로토콜과 호환되지 않는다.
// testcontainers가 docker-java 3.7.x를 공식 채택한 버전을 릴리스하면 이 force 블록을 제거하고
// testImplementation의 testcontainers 버전만 올리면 된다.
configurations.testRuntimeClasspath {
	resolutionStrategy {
		force 'com.github.docker-java:docker-java-api:3.7.1'
		force 'com.github.docker-java:docker-java-transport:3.7.1'
		force 'com.github.docker-java:docker-java-transport-zerodep:3.7.1'
	}
}
